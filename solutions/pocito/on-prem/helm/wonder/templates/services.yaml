{{- $root := . -}}
{{- range $name, $port := dict "wonder" 8045 "marketplace" 8046 "agno" 8047 "litellm" 4000 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-{{ $name }}
spec:
  selector:
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - {name: http, port: {{ $port }}, targetPort: http}
{{- end }}

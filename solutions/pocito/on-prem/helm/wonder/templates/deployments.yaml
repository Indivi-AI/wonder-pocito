{{- $root := . -}}
{{- range $name, $spec := dict
  "wonder" (dict "image" .Values.images.wonder "port" 8045 "probe" "/health")
  "marketplace" (dict "image" .Values.images.marketplace "port" 8046 "probe" "/healthz")
  "agno" (dict "image" .Values.images.marketplace "port" 8047 "probe" "/healthz")
  "litellm" (dict "image" .Values.images.litellm "port" 4000 "probe" "") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-{{ $name }}
  labels:
    app.kubernetes.io/component: {{ $name }}
    {{- include "wonder.labels" $root | nindent 4 }}
spec:
  replicas: {{ index $root.Values.replicas $name }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmaps.yaml") $root | sha256sum }}
      labels:
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      serviceAccountName: {{ $root.Release.Name }}
      securityContext:
        runAsNonRoot: true
        {{- if eq $root.Values.platform "kubernetes" }}
        runAsUser: 10001
        {{- end }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $name }}
          image: {{ $spec.image | quote }}
          imagePullPolicy: {{ $root.Values.images.pullPolicy }}
          {{- if eq $name "agno" }}
          command: [python, agno_server.py]
          {{- else if eq $name "litellm" }}
          args: [--config, /etc/litellm/config.yaml, --port, "4000"]
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $spec.port }}
          envFrom:
            - configMapRef:
                name: {{ $root.Release.Name }}-{{ $name }}
          {{- if or (eq $name "marketplace") (eq $name "agno") }}
          env:
            - name: MARKETPLACE_S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ $root.Values.secretName }}, key: S3_ACCESS_KEY}}
            - name: MARKETPLACE_S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ $root.Values.secretName }}, key: S3_SECRET_KEY}}
          {{- else if eq $name "litellm" }}
          env:
            - name: LLM_API_KEY   # the config's os.environ/LLM_API_KEY; optional - a site yaml may inline its own key
              valueFrom: {secretKeyRef: {name: {{ $root.Values.secretName }}, key: LLM_API_KEY, optional: true}}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            {{- if $spec.probe }}
            httpGet: {path: {{ $spec.probe }}, port: http}
            {{- else }}
            tcpSocket: {port: http}
            {{- end }}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            {{- if $spec.probe }}
            httpGet: {path: {{ $spec.probe }}, port: http}
            {{- else }}
            tcpSocket: {port: http}
            {{- end }}
          livenessProbe:
            {{- if $spec.probe }}
            httpGet: {path: {{ $spec.probe }}, port: http}
            {{- else }}
            tcpSocket: {port: http}
            {{- end }}
          resources:
            {{- toYaml (index $root.Values.resources $name) | nindent 12 }}
          {{- if eq $name "wonder" }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          {{- else if eq $name "agno" }}
          volumeMounts:
            - {name: data, mountPath: /data}
          {{- else if eq $name "litellm" }}
          volumeMounts:
            - {name: config, mountPath: /etc/litellm/config.yaml, subPath: config.yaml}
          {{- end }}
      {{- if eq $name "wonder" }}
      volumes:
        - {name: tmp, emptyDir: {}}
      {{- else if eq $name "agno" }}
      volumes:
        - {name: data, emptyDir: {}}
      {{- else if eq $name "litellm" }}
      volumes:
        - name: config
          configMap: {name: {{ $root.Release.Name }}-litellm}
      {{- end }}
{{- end }}

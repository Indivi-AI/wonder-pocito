{{- if .Values.minio.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-minio-init
data:
  minio-init.py: |
{{ .Files.Get "files/minio-init.py" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-minio
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: minio}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: minio}
    spec:
      containers:
        - name: minio
          image: {{ .Values.images.minio | quote }}
          args: [server, /data, --console-address, ":9001"]
          ports:
            - {name: s3, containerPort: 9000}
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: S3_ACCESS_KEY}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: S3_SECRET_KEY}}
          readinessProbe: {tcpSocket: {port: s3}}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-minio
spec:
  type: NodePort
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: minio}
  ports:
    - {name: s3, port: 9000, targetPort: s3, nodePort: {{ .Values.minio.nodePort }}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-minio-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: init
          image: {{ .Values.images.marketplace | quote }}
          command: [python, /minio-init.py]
          env:
            - {name: MINIO_ENDPOINT, value: "http://{{ .Release.Name }}-minio:9000"}
            - {name: WONDER_BUCKETS, value: {{ .Values.minio.buckets | quote }}}
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: S3_ACCESS_KEY}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: S3_SECRET_KEY}}
          volumeMounts:
            - {name: script, mountPath: /minio-init.py, subPath: minio-init.py}
      volumes:
        - name: script
          configMap: {name: {{ .Release.Name }}-minio-init}
{{- end }}

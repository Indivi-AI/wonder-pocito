{{- if eq .Values.platform "kubernetes" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
spec:
  ingressClassName: {{ .Values.exposure.ingressClassName }}
  rules:
    {{- range $name, $host := .Values.exposure.hosts }}
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-{{ $name }}
                port: {name: http}
    {{- end }}
{{- end }}

# Kit overlay for docker-compose.yml: serve wonder from the ./wonder-source clone of wonder.bundle instead of
# the image's baked copy - applets get live-repo serving (jb6 needs a real .git to find the repo root) and
# in-gap edits go live with `docker compose restart wonder`, no image rebuild. node_modules stay the image's
# own via the shadowing volume. docker-up.sh adds this file automatically when the clone exists.
services:
  wonder:
    volumes:
      - ./wonder-source:/usr/src/app
      - liverepo-node-modules:/usr/src/app/node_modules

volumes:
  liverepo-node-modules: {}

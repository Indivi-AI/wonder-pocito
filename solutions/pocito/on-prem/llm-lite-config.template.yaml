# LLM routing lives HERE; the api key does NOT - it is typed into .env (LLM_API_KEY) on the machine that runs
# the stack, so no kit, image or config file ever carries it. Copy to llm-lite-config.yaml NEXT TO
# docker-compose.yml, set the endpoint, never commit (.gitignored).
# The wildcard passes any requested model to one OpenAI-compatible upstream; sites may list explicit model_name
# entries instead, and a site-owned yaml may inline its own api_key and skip LLM_API_KEY entirely.
# The model applets start with is LLM_MODEL in .env (e.g. openai/gpt-5-mini - the part after the provider prefix
# must exist upstream). k8s/OpenShift mounts this same file via: helm --set-file llm.config=llm-lite-config.yaml.
# Full syntax: https://docs.litellm.ai/docs/proxy/configs
model_list:
  - model_name: "*"
    litellm_params:
      model: openai/*
      api_base: https://api.openai.com/v1   # sim: real OpenAI; site: the internal OpenAI-compatible endpoint
      api_key: os.environ/LLM_API_KEY

# Copied to ignored config.local.yaml on first connected startup. Put real provider settings and keys there.
model_list:
  - model_name: chat
    litellm_params:
      model: openai/gpt-5-mini
      api_base: https://api.openai.com/v1
      api_key: ""
  - model_name: embeddings
    litellm_params:
      model: openai/text-embedding-3-small
      api_base: https://api.openai.com/v1
      api_key: ""
    model_info:
      mode: embedding
litellm_settings:
  telemetry: false
  # Moves <mm:think> blocks leaked into content into reasoning_content so OMP renders them as thinking. LITELLM_THINK_TAG overrides the tag.
  callbacks: minimax_think.reasoning_splitter

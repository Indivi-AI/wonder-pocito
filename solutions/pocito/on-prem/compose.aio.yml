name: wonder-onprem
# Single-app-container variant: the wonder-aio image runs wonder+marketplace+agno+litellm via aio-start.sh;
# pgvector (and the optional local minio) ride alongside. Same rule as docker-compose.yml: every call crosses
# the host at SITE_HOST:published-port. The ./wonder-source clone is REQUIRED (docker-up.sh / docker-up.ps1
# create it from wonder.bundle): mounted at /usr/src/app it makes applets serve live-repo and lets in-gap
# edits go live with `docker compose restart aio` - no image rebuilds. node_modules stay the image's own
# via the shadowing volume. In-container ports: wonder 8045, marketplace 8046, agno 8047, litellm 4000.

networks:
  edge: {}

volumes:
  minio-data: {}
  agno-runtime: {}
  pgvector-data: {}
  aio-node-modules: {}

services:
  aio:
    image: wonder-aio:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "${WONDER_PUBLISHED_PORT:-58045}:8045"
      - "${MARKETPLACE_PUBLISHED_PORT:-58046}:8046"
      - "${LLM_LITE_PUBLISHED_PORT:-58047}:4000"
      - "${AGNO_PUBLISHED_PORT:-58049}:8047"
    networks: [edge]
    extra_hosts: ["${SITE_HOST}:host-gateway"]
    depends_on:
      pgvector: {condition: service_healthy}
    volumes:
      - ./wonder-source:/usr/src/app
      - aio-node-modules:/usr/src/app/node_modules
      - agno-runtime:/data
      - "${LLM_LITE_CONFIG:-./llm-lite-config.yaml}:/etc/litellm/config.yaml:ro"
    environment:
      STORAGE_PROVIDER: minio
      WONDER_AUTH_MODE: none
      WONDER_SERVICE_URL: http://127.0.0.1:8045
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-${SITE_SCHEME:-http}://${SITE_HOST}:${MINIO_PUBLISHED_PORT:-58048}}
      MARKETPLACE_API_URL: ${SITE_SCHEME:-http}://${SITE_HOST}:${MARKETPLACE_PUBLISHED_PORT:-58046}
      AGNO_API_URL: ${SITE_SCHEME:-http}://${SITE_HOST}:${AGNO_PUBLISHED_PORT:-58049}
      LLM_PROXY_URL: ${SITE_SCHEME:-http}://${SITE_HOST}:${WONDER_PUBLISHED_PORT:-58045}/llmProxy
      LLM_PROXY_TARGET: ${SITE_SCHEME:-http}://${SITE_HOST}:${LLM_LITE_PUBLISHED_PORT:-58047}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY:-}
      MARKETPLACE_S3_ENDPOINT: ${MINIO_ENDPOINT:-${SITE_SCHEME:-http}://${SITE_HOST}:${MINIO_PUBLISHED_PORT:-58048}}
      MARKETPLACE_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      MARKETPLACE_S3_SECRET_KEY: ${S3_SECRET_KEY}
      MARKETPLACE_S3_BUCKET: ${MARKETPLACE_S3_BUCKET:-wonder-marketplace}
      MARKETPLACE_S3_STORAGE_CLASS: ${MARKETPLACE_S3_STORAGE_CLASS:-}
      CORS_ALLOWED_ORIGINS: ${SITE_SCHEME:-http}://${SITE_HOST}:${WONDER_PUBLISHED_PORT:-58045}
      SITE_HOST: ${SITE_HOST}
      OPENAI_BASE_URL: ${SITE_SCHEME:-http}://${SITE_HOST}:${LLM_LITE_PUBLISHED_PORT:-58047}/v1
      OPENAI_API_KEY: unused   # litellm runs keyless; the OpenAI SDK just requires a non-empty string
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      PGVECTOR_URL: ${PGVECTOR_URL:-}
      PGVECTOR_HOST: ${SITE_HOST}
      PGVECTOR_PORT: ${PGVECTOR_PUBLISHED_PORT:-58050}
      POSTGRES_DB: ${POSTGRES_DB:-wonder}
      POSTGRES_USER: ${POSTGRES_USER:-wonder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wonder-pg-local}
      MARKETPLACE_MODEL_FACTORY: ${MARKETPLACE_MODEL_FACTORY:-}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      FLAPI_BASE_URL: ${FLAPI_BASE_URL:-}
      FLAPI_BEARER_TOKEN: ${FLAPI_BEARER_TOKEN:-}

  pgvector:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:0.8.6-pg16-bookworm}
    restart: unless-stopped
    command: ["postgres", "-c", "maintenance_work_mem=1GB"]
    shm_size: 1gb
    ports: ["${PGVECTOR_PUBLISHED_PORT:-58050}:5432"]
    networks: [edge]
    volumes: [pgvector-data:/var/lib/postgresql/data]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wonder}
      POSTGRES_USER: ${POSTGRES_USER:-wonder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wonder-pg-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wonder} -d ${POSTGRES_DB:-wonder}"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    profiles: [local-minio]
    restart: unless-stopped
    command: server /data --console-address :9001
    ports: ["${MINIO_PUBLISHED_PORT:-58048}:9000"]
    networks: [edge]
    volumes: [minio-data:/data]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}

  minio-init:
    image: wonder-aio:${IMAGE_TAG}
    profiles: [local-minio]
    restart: "no"
    networks: [edge]
    extra_hosts: ["${SITE_HOST}:host-gateway"]
    volumes: ["./minio-init.py:/minio-init.py:ro"]
    command: ["python", "/minio-init.py"]
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-${SITE_SCHEME:-http}://${SITE_HOST}:${MINIO_PUBLISHED_PORT:-58048}}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      WONDER_BUCKETS: ${WONDER_BUCKETS:-indiviai-wonder,wonder-code-packages,indiviai-wonder-protected,logs-bucket-me-west1}

# The single home for LLM routing AND secrets: models, upstream endpoint and api keys live HERE, never in .env.site.
# Copy to llm-lite-config.yaml NEXT TO docker-compose.yml, fill, never commit (.gitignored). Include it in the whitening kit.
# The wildcard passes any requested model to one OpenAI-compatible upstream; sites may list explicit model_name entries instead.
# The model applets start with is LLM_MODEL in .env.site (e.g. openai/gpt-5-mini - the part after the provider prefix must exist upstream).
# k8s/OpenShift mounts this same file via: helm --set-file llm.config=llm-lite-config.yaml. Full syntax: https://docs.litellm.ai/docs/proxy/configs
model_list:
  - model_name: "*"
    litellm_params:
      model: openai/*
      api_base: https://api.openai.com/v1   # sim: real OpenAI; site: the internal OpenAI-compatible endpoint
      api_key: fill-me

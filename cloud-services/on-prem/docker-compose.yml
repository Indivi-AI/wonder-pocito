name: wonder-onprem
# One file for every network. All values come from .env.site (compose --env-file .env.site ...); nothing site-specific lives here.
# Outside sim adds compose.airgap.yml (blocks egress for app services, grants it to llm-lite which plays the site LLM endpoint).

networks:
  appnet:
    internal: true
  edge: {}

volumes:
  minio-data: {}
  marketplace-runtime: {}

services:
  wonder:
    image: wonder-server:${IMAGE_TAG}
    restart: unless-stopped
    ports: ["${WONDER_PUBLISHED_PORT}:${WONDER_PORT}"]
    networks: [appnet, edge]
    environment:
      PORT: ${WONDER_PORT}
      STORAGE_PROVIDER: minio
      WONDER_AUTH_MODE: none
      WONDER_SERVICE_URL: http://127.0.0.1:${WONDER_PORT}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      WONDER_STORAGE_URL: ${SITE_SCHEME}://${SITE_HOST}:${MINIO_PUBLISHED_PORT}
      MARKETPLACE_API_URL: ${SITE_SCHEME}://${SITE_HOST}:${MARKETPLACE_PUBLISHED_PORT}
      LLM_PROXY_URL: ${SITE_SCHEME}://${SITE_HOST}:${WONDER_PUBLISHED_PORT}/llmProxy
      LLM_PROXY_TARGET: http://llm-lite:4000
      LLM_PROXY_KEY: ${LLM_PROXY_KEY}

  marketplace:
    image: marketplace-server:${IMAGE_TAG}
    restart: unless-stopped
    ports: ["${MARKETPLACE_PUBLISHED_PORT}:${AGENT_OS_PORT}"]
    networks: [appnet, edge]
    volumes: [marketplace-runtime:/data]
    environment:
      AGENT_OS_HOST: 0.0.0.0
      AGENT_OS_PORT: ${AGENT_OS_PORT}
      MARKETPLACE_DATA_DIR: /data
      MARKETPLACE_S3_ENDPOINT: ${MINIO_ENDPOINT}
      MARKETPLACE_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      MARKETPLACE_S3_SECRET_KEY: ${S3_SECRET_KEY}
      MARKETPLACE_S3_BUCKET: ${MARKETPLACE_S3_BUCKET}
      MARKETPLACE_S3_STORAGE_CLASS: ${MARKETPLACE_S3_STORAGE_CLASS}
      CORS_ALLOWED_ORIGINS: ${SITE_SCHEME}://${SITE_HOST}:${WONDER_PUBLISHED_PORT}
      OPENAI_BASE_URL: http://llm-lite:4000/v1
      OPENAI_API_KEY: ${LLM_PROXY_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      MARKETPLACE_MODEL_FACTORY: ${MARKETPLACE_MODEL_FACTORY}

  llm-lite:
    image: ${LLM_LITE_IMAGE}
    restart: unless-stopped
    networks: [appnet]
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    volumes: ["./llm-lite-config.yaml:/etc/litellm/config.yaml:ro"]
    environment:
      LLM_PROXY_KEY: ${LLM_PROXY_KEY}
      LLM_UPSTREAM_BASE: ${LLM_UPSTREAM_BASE}
      LLM_UPSTREAM_KEY: ${LLM_UPSTREAM_KEY}

  minio:
    image: ${MINIO_IMAGE}
    profiles: [local-minio]
    restart: unless-stopped
    command: server /data --console-address :9001
    ports: ["${MINIO_PUBLISHED_PORT}:9000"]
    networks: [appnet, edge]
    volumes: [minio-data:/data]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}

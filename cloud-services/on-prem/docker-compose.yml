name: wonder-onprem
# One file for every network; all values interpolate from .env.site; nothing site-specific lives here.
# THE RULE: every call - browser AND service-to-service - crosses the host through a published port
# (SITE_HOST:x, mapped x->y into the container). There is deliberately NO internal docker network or DNS,
# so nothing can accidentally depend on an address browsers cannot reach (e.g. presigned S3 urls stay valid).
# Containers resolve SITE_HOST to the host via host-gateway; on OpenShift the cluster DNS/route plays that role.

networks:
  edge: {}

x-marketplace-s3-env: &marketplace-s3-env   # marketplace + agno share ONLY this object store - no calls between them
  MARKETPLACE_S3_ENDPOINT: ${MINIO_ENDPOINT:-${SITE_SCHEME}://${SITE_HOST}:${MINIO_PUBLISHED_PORT}}
  MARKETPLACE_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  MARKETPLACE_S3_SECRET_KEY: ${S3_SECRET_KEY}
  MARKETPLACE_S3_BUCKET: ${MARKETPLACE_S3_BUCKET}
  MARKETPLACE_S3_STORAGE_CLASS: ${MARKETPLACE_S3_STORAGE_CLASS}
  CORS_ALLOWED_ORIGINS: ${SITE_SCHEME}://${SITE_HOST}:${WONDER_PUBLISHED_PORT}

volumes:
  minio-data: {}
  agno-runtime: {}

services:
  wonder:
    image: wonder-server:${IMAGE_TAG}
    restart: unless-stopped
    ports: ["${WONDER_PUBLISHED_PORT}:${WONDER_PORT}"]
    networks: [edge]
    extra_hosts: ["${SITE_HOST}:host-gateway"]
    environment:
      PORT: ${WONDER_PORT}
      STORAGE_PROVIDER: minio
      WONDER_AUTH_MODE: none
      WONDER_SERVICE_URL: http://127.0.0.1:${WONDER_PORT}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-${SITE_SCHEME}://${SITE_HOST}:${MINIO_PUBLISHED_PORT}}
      MARKETPLACE_API_URL: ${SITE_SCHEME}://${SITE_HOST}:${MARKETPLACE_PUBLISHED_PORT}
      AGNO_API_URL: ${SITE_SCHEME}://${SITE_HOST}:${AGNO_PUBLISHED_PORT}
      LLM_PROXY_URL: ${SITE_SCHEME}://${SITE_HOST}:${WONDER_PUBLISHED_PORT}/llmProxy
      LLM_PROXY_TARGET: ${SITE_SCHEME}://${SITE_HOST}:${LLM_LITE_PUBLISHED_PORT}
      LLM_MODEL: ${LLM_MODEL}

  marketplace:
    image: marketplace-server:${IMAGE_TAG}
    restart: unless-stopped
    ports: ["${MARKETPLACE_PUBLISHED_PORT}:${MARKETPLACE_PORT}"]
    networks: [edge]
    extra_hosts: ["${SITE_HOST}:host-gateway"]
    environment:
      <<: *marketplace-s3-env
      MARKETPLACE_HOST: 0.0.0.0
      MARKETPLACE_PORT: ${MARKETPLACE_PORT}

  agno:
    image: marketplace-server:${IMAGE_TAG}
    command: ["python", "agno_server.py"]
    restart: unless-stopped
    ports: ["${AGNO_PUBLISHED_PORT}:${AGENT_OS_PORT}"]
    networks: [edge]
    extra_hosts: ["${SITE_HOST}:host-gateway"]
    volumes: [agno-runtime:/data]
    environment:
      <<: *marketplace-s3-env
      AGENT_OS_HOST: 0.0.0.0
      AGENT_OS_PORT: ${AGENT_OS_PORT}
      MARKETPLACE_DATA_DIR: /data
      OPENAI_BASE_URL: ${SITE_SCHEME}://${SITE_HOST}:${LLM_LITE_PUBLISHED_PORT}/v1
      OPENAI_API_KEY: unused   # llm-lite runs keyless; the OpenAI SDK just requires a non-empty string
      MARKETPLACE_MODEL_FACTORY: ${MARKETPLACE_MODEL_FACTORY}

  llm-lite:
    image: ${LLM_LITE_IMAGE}
    restart: unless-stopped
    ports: ["${LLM_LITE_PUBLISHED_PORT}:4000"]
    networks: [edge]
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    volumes: ["./llm-lite-config.yaml:/etc/litellm/config.yaml:ro"]   # routing + secrets live in that file (copy its .template)

  minio:
    image: ${MINIO_IMAGE}
    profiles: [local-minio]
    restart: unless-stopped
    command: server /data --console-address :9001
    ports: ["${MINIO_PUBLISHED_PORT}:9000"]
    networks: [edge]
    volumes: [minio-data:/data]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}

  minio-init:
    image: marketplace-server:${IMAGE_TAG}
    profiles: [local-minio]
    restart: "no"
    networks: [edge]
    extra_hosts: ["${SITE_HOST}:host-gateway"]
    volumes: ["./helm/wonder/files/minio-init.py:/minio-init.py:ro"]
    command: ["python", "/minio-init.py"]
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-${SITE_SCHEME}://${SITE_HOST}:${MINIO_PUBLISHED_PORT}}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      WONDER_BUCKETS: ${WONDER_BUCKETS}

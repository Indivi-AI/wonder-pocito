# Outside-sim overlay: docker compose --env-file .env.site -f docker-compose.yml -f compose.airgap.yml --profile local-minio up -d
# edge loses masquerade so wonder/marketplace/minio cannot reach the internet (published ports still work);
# llm-lite alone gets real egress, playing the on-prem internal LLM endpoint.
networks:
  edge:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  egress: {}

services:
  llm-lite:
    networks: [appnet, egress]

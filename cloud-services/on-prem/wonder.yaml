apiVersion: apps/v1
kind: Deployment
metadata: {name: wonder-public}
spec:
  replicas: 1
  selector: {matchLabels: {app: wonder-public}}
  template:
    metadata: {labels: {app: wonder-public}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: wonder
          image: wonder:replace-me
          imagePullPolicy: IfNotPresent
          envFrom: [{secretRef: {name: wonder-runtime}}]
          env: [{name: WONDER_SERVICE, value: public}]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 15, periodSeconds: 10}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {memory: 2Gi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
---
apiVersion: v1
kind: Service
metadata: {name: wonder-public}
spec: {selector: {app: wonder-public}, ports: [{name: http, port: 8080, targetPort: http}]}

  port: 18080
  hosts:
    wonder: wonder.localhost
    marketplace: marketplace.localhost
    agno: agno.localhost

storage:
  endpoint: http://wonder-minio:9000
  publicEndpoint: http://localhost:30900

# llm.model + llm.config come from local-k8s-up.sh (--set-string / --set-file, out of .env.site + llm-lite-config.yaml)

minio:
  enabled: true

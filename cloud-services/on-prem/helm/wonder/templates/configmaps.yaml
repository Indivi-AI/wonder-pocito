{{- $wonderUrl := include "wonder.publicUrl" (list . .Values.exposure.hosts.wonder) -}}
{{- $marketplaceUrl := include "wonder.publicUrl" (list . .Values.exposure.hosts.marketplace) -}}
{{- $agnoUrl := include "wonder.publicUrl" (list . .Values.exposure.hosts.agno) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-wonder
data:
  PORT: "8045"
  STORAGE_PROVIDER: minio
  WONDER_AUTH_MODE: none
  WONDER_SERVICE_URL: http://127.0.0.1:8045
  MINIO_ENDPOINT: {{ .Values.storage.endpoint | quote }}
  WONDER_STORAGE_URL: {{ default .Values.storage.endpoint .Values.storage.publicEndpoint | quote }}
  MARKETPLACE_API_URL: {{ $marketplaceUrl | quote }}
  AGNO_API_URL: {{ $agnoUrl | quote }}
  LLM_PROXY_URL: {{ printf "%s/llmProxy" $wonderUrl | quote }}
  LLM_PROXY_TARGET: {{ printf "http://%s-litellm:4000" .Release.Name | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-marketplace
data:
  MARKETPLACE_HOST: 0.0.0.0
  MARKETPLACE_PORT: "8046"
  MARKETPLACE_S3_ENDPOINT: {{ .Values.storage.endpoint | quote }}
  MARKETPLACE_S3_PUBLIC_ENDPOINT: {{ default .Values.storage.endpoint .Values.storage.publicEndpoint | quote }}
  MARKETPLACE_S3_BUCKET: {{ .Values.storage.marketplaceBucket | quote }}
  MARKETPLACE_S3_STORAGE_CLASS: {{ .Values.storage.marketplaceStorageClass | quote }}
  CORS_ALLOWED_ORIGINS: {{ $wonderUrl | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-agno
data:
  AGENT_OS_HOST: 0.0.0.0
  AGENT_OS_PORT: "8047"
  MARKETPLACE_DATA_DIR: /data
  MARKETPLACE_S3_ENDPOINT: {{ .Values.storage.endpoint | quote }}
  MARKETPLACE_S3_PUBLIC_ENDPOINT: {{ default .Values.storage.endpoint .Values.storage.publicEndpoint | quote }}
  MARKETPLACE_S3_BUCKET: {{ .Values.storage.marketplaceBucket | quote }}
  MARKETPLACE_S3_STORAGE_CLASS: {{ .Values.storage.marketplaceStorageClass | quote }}
  CORS_ALLOWED_ORIGINS: {{ $wonderUrl | quote }}
  OPENAI_BASE_URL: {{ printf "http://%s-litellm:4000/v1" .Release.Name | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-litellm
data:
  LLM_UPSTREAM_BASE: {{ .Values.llm.upstreamBase | quote }}
  config.yaml: |
{{ default (.Files.Get "files/llm-lite-config.yaml") .Values.llm.config | nindent 4 }}
